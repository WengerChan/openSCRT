name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # vcpkg lives outside the tracked source tree; `.cache/` and `out/` are git-ignored.
  VCPKG_ROOT_DIR: ${{ github.workspace }}/.cache/vcpkg
  # Must be exactly $VCPKG_ROOT_DIR/vcpkg_installed: that is where vcpkg puts the tree in
  # classic mode, and CMake is pointed here. Run #8 installed to <repo>/vcpkg_installed while
  # CMake looked in out/vcpkg_installed, which would have failed at configure even with every
  # dependency built.
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.cache/vcpkg/vcpkg_installed
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/binary

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux-ci
            triplet: x64-linux
            timeout: 60
          - os: windows-2022
            preset: windows-ci
            triplet: x64-windows
            # P0-A6 puts the whole cold-start job at 45 min. This leg used to need 75.6 min,
            # nearly all of it a vcpkg source build -- so the timeout is now the guardrail that
            # catches a regression back into "install a port nothing links", not a licence to
            # stay slow. If this ever fires, the cause is the dependency step, not the build.
            timeout: 45
          - os: macos-14
            preset: macos-ci
            triplet: arm64-osx
            timeout: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure vcpkg environment
        shell: bash
        run: |
          # vcpkg refuses to start when VCPKG_DEFAULT_BINARY_CACHE names a directory that does
          # not exist, and a cold runner has none of these.
          mkdir -p "$VCPKG_BINARY_CACHE" "$VCPKG_INSTALLED_DIR" "$VCPKG_ROOT_DIR"
          echo "VCPKG_ROOT=$VCPKG_ROOT_DIR" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$VCPKG_BINARY_CACHE" >> "$GITHUB_ENV"
          echo "VCPKG_TARGET_TRIPLET=${{ matrix.triplet }}" >> "$GITHUB_ENV"
          # The runner images already ship python3, cmake and ninja. Without this, vcpkg
          # builds its own host copies -- which meant a full CPython source build (gettext,
          # libiconv, libuuid, python3) in every run, and that build then failed in autoreconf.
          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      - name: Cache vcpkg installed tree and downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLED_DIR }}
            ${{ env.VCPKG_ROOT_DIR }}/downloads
            ${{ env.VCPKG_ROOT_DIR }}/packages
            ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: lukka/get-cmake@latest
        with:
          # Pinned to the 3.31 line on purpose. An open-ended '>=3.28.3' resolved to CMake
          # 4.4.4, and the pinned vcpkg toolchain (2025-09 baseline) does not cooperate with
          # CMake 4's prefix-path handling: every find_package came back empty even though
          # vcpkg had installed the ports. cmake_minimum_required in this repo is 3.28, so
          # 3.31 is a supported, deliberately chosen toolchain -- not a floor.
          cmakeVersion: '~3.31.0'
          ninjaVersion: '1.12.1'

      - name: Acquire vcpkg at the manifest baseline
        shell: bash
        run: |
          # Shallow fetch of exactly the pinned baseline commit: manifest mode needs that
          # commit object for version resolution, and a full clone would be far slower.
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git init -q "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT_DIR" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT_DIR" checkout -q --force FETCH_HEAD
          # The `vcpkg` driver is NOT tracked in the microsoft/vcpkg repo -- bootstrap-vcpkg.sh
          # fetches or builds it into the root. Running it right after get-cmake guarantees a
          # compiler and cmake are on PATH on every platform, including Windows where the
          # runner's system cmake cannot be relied on before MSVC is initialised.
          (cd "$VCPKG_ROOT_DIR" && ./bootstrap-vcpkg.sh -disableMetrics)
          "$VCPKG_ROOT_DIR/vcpkg" version

      # Compiler cache. Only matters for the non-Qt vcpkg dependencies, which are rebuilt
      # from source whenever the cache key moves.
      - name: Restore ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.preset }}-${{ github.sha }}
          max-size: 500MB
          save-keys: |
            deps-v1-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}

      - name: Enable ccache as compiler launcher
        if: runner.os != 'Windows'
        shell: bash
        # Windows: no compiler cache (sccache is not preinstalled on windows-2022), MSVC is fast enough.
        run: echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Install Qt 6.8 + qtserialport (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtserialport
          # No aqtversion pin: the action builds the pip requirement as
          # `aqtinstall${aqtversion}`, so a bare "3.1.0" becomes the nonexistent package
          # "aqtinstall3.1.0". Leaving it unset installs the latest aqtinstall.
          cache: true

      - name: Install Qt 6.8 + qtserialport (Linux/Windows)
        if: runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtserialport
          cache: true
          # The action exports QT_ROOT_DIR / QT_PLUGIN_PATH / QML2_IMPORT_PATH. There is no
          # Qt6_DIR in the environment -- the Configure step below feeds QT_ROOT_DIR straight
          # into CMAKE_PREFIX_PATH, and the configure output prints the Qt6Config.cmake that won.

      - name: Install autotools (autotools-based vcpkg ports)
        shell: bash
        # libsodium's port runs `autoreconf` at build time and hard-fails with an explicit
        # "requires autoconf" CMake error when the tool is missing. None of the runner images
        # ship it.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq autoconf automake libtool
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install autoconf automake libtool
          fi

      - name: Install tmux (Linux, the VT reference implementation)
        if: runner.os == 'Linux'
        shell: bash
        # The P1-A2 baselines in tests/baselines/vt are generated by tmux. tmux is not part of
        # the runner image, and a baseline produced by our own emulator would only prove that
        # we did not change -- tmux is what makes the comparison evidence about the escape
        # sequences rather than about us.
        run: |
          sudo apt-get install -y -qq tmux
          tmux -V

      - name: Install the real terminal programs (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # The corpus in tests/fixtures is written by hand. These three are the programs the
        # acceptance criterion names, and their output is captured live and compared against
        # tmux, so the comparison covers bytes nobody wrote by hand.
        run: |
          sudo apt-get install -y -qq vim htop less
          vim --version | head -1
          htop --version | head -1
          less --version | head -1

      - name: Install dependencies (vcpkg, manifest mode)
        shell: bash
        run: |
          # Rule: CI installs exactly the ports the tree actually links -- libsodium and gtest.
          # Everything else is provisioned elsewhere or not consumed yet, and a vcpkg port that
          # nothing links is a source build nobody waits for.
          #
          # This is not a micro-optimisation. On windows-2022 the vcpkg step was 74.6 min of a
          # 75.6 min job (run #6), because openssl + libssh were compiled from source on every
          # cold cache -- and the plan's own cold-start gate (P0-A6) is 45 min for the whole
          # job. The dropped ports below are referenced by ZERO find_package /
          # pkg_check_modules / target_link_libraries and zero #includes in src/ and tests/.
          #
          # vcpkg.json stays the single source of truth -- this step derives the CI manifest by
          # removing ports that are provisioned differently or not needed yet, and points
          # VCPKG_MANIFEST_DIR at it so `vcpkg install` never reaches for them.
          # (VCPKG_MANIFEST_NO_DEFAULT_FEATURES is not a thing; overriding the manifest
          # directory is the supported lever.)
          export VCPKG_MANIFEST_DIR="$RUNNER_TEMP/vcpkg-ci-manifest"
          # The skip table lives in one place (.github/scripts/ci-vcpkg-manifest.py) and is
          # shared with release.yml, so a port cannot be "un-skipped" in one workflow and stay
          # skipped in the other. vcpkg.json remains the source of truth; this derives from it.
          python .github/scripts/ci-vcpkg-manifest.py "$VCPKG_MANIFEST_DIR" --with-tests

          # Point CMake at the SAME reduced manifest, so vcpkg.cmake computes the installed-tree
          # prefix path from it. It never reads the repo-root vcpkg.json, which still lists
          # qtbase and friends for local builds.
          echo "VCPKG_MANIFEST_DIR=$VCPKG_MANIFEST_DIR" >> "$GITHUB_ENV"

          # Install in CLASSIC mode with explicit port names, not manifest mode.
          #
          # Bash 3.2 (the macOS runner's /bin/bash) has no mapfile, and the Windows runner's Git Bash
          # hands back CRLF-terminated lines. Both bit run #10, so read the file with a portable
          # loop and strip the carriage return explicitly.
          set -f
          SPECS=""
          while IFS= read -r port || [ -n "$port" ]; do
            port="${port%$'\r'}"
            [ -z "$port" ] && continue
            SPECS="${SPECS} ${port}:${VCPKG_TARGET_TRIPLET}"
          done < "$VCPKG_MANIFEST_DIR/ports.txt"
          set +f
          if [ -z "${SPECS// /}" ]; then
            echo "::error::no ports left to install after applying the SKIP table"
            exit 1
          fi

          # Classic mode is selected by the working directory, not by a flag: vcpkg treats
          # "there is a vcpkg.json in CWD (or above it)" as manifest mode and then rejects
          # explicit package arguments outright --
          #   error: In manifest mode, `vcpkg install` does not support individual package
          #   arguments.
          # The repo root has a vcpkg.json, so running from there always means manifest mode.
          # Running from an empty scratch dir outside the workspace leaves no manifest within
          # reach, which is what actually forces classic mode. Clearing VCPKG_MANIFEST_DIR too,
          # so no environment variable can point it back at a manifest.
          CLASSIC_DIR="$RUNNER_TEMP/vcpkg-classic-mode"
          mkdir -p "$CLASSIC_DIR"
          unset VCPKG_MANIFEST_DIR
          echo "vcpkg classic-mode install in $CLASSIC_DIR:${SPECS}"
          ( cd "$CLASSIC_DIR" && "$VCPKG_ROOT_DIR/vcpkg" install ${SPECS} \
              --x-install-root="$VCPKG_INSTALLED_DIR" )

      # A real SSH server for the SSH channel test (P1-A1).
      #
      # Until now every SSH test covered a failure path, because there was no server to
      # connect to: the handshake and the public-key login were never executed anywhere.
      # The Linux leg starts an sshd on a loopback port and points the test at it.
      - name: Start a local SSH server (Linux)
        if: runner.os == 'Linux'
        # Not fatal: a runner that cannot start sshd must still build and test everything
        # else. The SSH test then skips itself and says so, instead of the whole job
        # failing on an optional server.
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keygen -t ed25519 -N '' -f "$HOME/.ssh/openscrt_test_key" -q
          cp "$HOME/.ssh/openscrt_test_key.pub" "$HOME/.ssh/authorized_keys"
          # The ssh.com (VanDyke) key the P1-T11 test uses, so the conversion is proved
          # end to end: the server accepts the key that our parser produced from the
          # ssh.com file, not just a key libssh already understood.
          printf 'ssh-rsa %s openscrt-sshcom-fixture\n' \
            "$(cat tests/fixtures/ssh/sshcom_rsa_plain.pub)" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          # StrictModes off: the runner's home directory is not root-owned, and sshd would
          # otherwise refuse the authorized_keys file for that reason alone.
          SSHD_CONFIG="$RUNNER_TEMP/sshd_config"
          cat > "$SSHD_CONFIG" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          AuthorizedKeysFile $HOME/.ssh/authorized_keys
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          # UsePAM yes, not no: with UsePAM no, sshd refuses any account whose password
          # field is locked -- and the runner account's is. The login then fails with a
          # bare "authentication failed" that has nothing to do with the key.
          UsePAM yes
          PermitRootLogin no
          StrictModes no
          UseDNS no
          LogLevel VERBOSE
          EOF

          sudo /usr/sbin/sshd -f "$SSHD_CONFIG" -E "$RUNNER_TEMP/sshd.log" || {
            echo "::error::sshd refused to start"
            cat "$RUNNER_TEMP/sshd.log" || true
            exit 1
          }

          # Wait for the port to answer before handing the test over.
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then
              exec 3>&-
              break
            fi
            sleep 1
          done
          if ! (exec 3<>/dev/tcp/127.0.0.1/2222) 2>/dev/null; then
            echo "::error::sshd did not answer on port 2222"
            cat "$RUNNER_TEMP/sshd.log" || true
            exit 1
          fi

          echo "OPENCRT_TEST_SSH_PORT=2222" >> "$GITHUB_ENV"
          echo "OPENCRT_TEST_SSH_USER=$(id -un)" >> "$GITHUB_ENV"
          echo "OPENCRT_TEST_SSH_KEY=$HOME/.ssh/openscrt_test_key" >> "$GITHUB_ENV"

      - name: Configure (${{ matrix.preset }})
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} \
            -DOPENCRT_ENABLE_COVERAGE=${{ runner.os == 'Linux' && 'ON' || 'OFF' }} \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_MANIFEST_DIR="$VCPKG_MANIFEST_DIR" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET" \
            -DGTest_ROOT="$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET"

      - name: Build (${{ matrix.preset }})
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}

      # P1-A2: regenerate the VT baselines with tmux and publish them.
      #
      # This step runs before the unit tier on purpose. The first run of a new fixture has
      # no committed baseline yet, so the unit tier fails -- and a failed step skips
      # everything after it. Generating and publishing the baselines first means the
      # evidence survives the failure, and the baselines can be reviewed and committed.
      - name: VT baselines (regenerate with tmux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          OPENCRT_VT_WRITE_BASELINES=out/vt-baselines \
            out/build/${{ matrix.preset }}/bin/unit_vt_baseline \
            --gtest_filter='VtBaselineTest.TheCorpusIsNotEmpty'
          # The raw captures of what vim, htop and less draw. They are published next to
          # the baselines so a difference can be diagnosed from the bytes rather than from
          # the picture they produce. The comparison itself may fail -- that is the point
          # of publishing them -- so this step does not turn that into a build failure.
          OPENCRT_VT_CAPTURE_DIR=out/vt-captures \
            out/build/${{ matrix.preset }}/bin/unit_vt_baseline \
            --gtest_filter='VtBaselineTest.RealProgramOutputRendersTheWayTmuxRendersIt' || true

      - name: Upload VT baselines
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vt-baselines-linux
          path: |
            out/vt-baselines
            out/vt-captures
          if-no-files-found: error

      - name: Test (unit tier)
        shell: bash
        # -L unit is mandatory: the test preset runs *everything*, so without this filter the
        # perf tier would silently execute on Windows and macOS too.
        run: ctest --test-dir out/build/${{ matrix.preset }} -C Release -L unit --output-on-failure --timeout 600

      - name: Test (perf tier, Linux only)
        if: runner.os == 'Linux'
        continue-on-error: false
        shell: bash
        env:
          # The working set the roadmap names: 128,000 lines or more, so the scrollback is
          # measured at full size (and past its 131,072-line cap, so the eviction path runs
          # too). 140,000 lines cost about 60 ms -- there was no reason to scale them down.
          OPENCRT_PERF_ITERS: "140000"
          # seq 1 1000000, the stream P1-A3 is written against.
          OPENCRT_PERF_LINES: "1000000"
        run: # -V: the perf tier exists to produce numbers, and ctest hides a passing test's
          # output otherwise. This is what makes P1-A3 evidence visible in the run log.
          ctest --test-dir out/build/${{ matrix.preset }} -C Release -L perf -V --output-on-failure --timeout 600

      # P0-A5: coverage report with an enforced floor. gcovr filters to the libraries that carry
      # unit tests and drops src/app (a non-test executable that would report a permanent 0%).
      - name: Coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pipx install gcovr || pip install --user gcovr
          GCOVR=$(command -v gcovr || echo "$HOME/.local/bin/gcovr")
          mkdir -p out/coverage
          "$GCOVR" --root . --filter 'src/core/' --filter 'src/terminal/' \
                   --filter 'src/protocols/' --exclude 'src/app/' \
                   --exclude-unreachable-branches --exclude-throw-branches \
                   --xml out/coverage/coverage.xml \
                   --html-details out/coverage/index.html \
                   --print-summary \
                   --fail-under-line 40

      - name: Upload coverage report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: out/coverage
          if-no-files-found: error

      # P1-A2: the committed baselines must still be what tmux produces.
      #
      # The unit tier compares our emulator against the committed baselines. That check
      # proves we did not drift from them, but not that the baselines are still right --
      # only tmux can say that. This step regenerates them and diffs.
      #
      # It runs after the coverage report so a drift does not swallow the coverage
      # evidence, and before the sanitizer so the sanitizer stays last.
      - name: VT baselines (drift against tmux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d tests/baselines/vt ]; then
            echo "::error::no committed VT baselines; see the vt-baselines-linux artifact"
            exit 1
          fi
          diff -ru --exclude=README.md tests/baselines/vt out/vt-baselines

      # P1-A4: the SPSC ring buffer under ThreadSanitizer.
      #
      # Its own build tree, because --coverage must not be on at the same time: gcov keeps
      # its counters in plain globals, two threads increment the same one, and the
      # sanitizer reports that as a data race in the ring buffer that is not there.
      #
      # It runs last on purpose: a failure here used to skip the build, the tests and the
      # coverage report, so the job died without producing any of the evidence the other
      # steps collect.
      - name: ThreadSanitizer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-tsan \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_MANIFEST_DIR="$VCPKG_MANIFEST_DIR" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET" \
            -DGTest_ROOT="$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET"
          # Only the sanitizer target: the rest of the tree was already built above.
          cmake --build --preset linux-tsan --target unit_spsc_ring_buffer_tsan
          ctest --test-dir out/build/linux-tsan -L tsan --output-on-failure --timeout 900

  format:
    name: format (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: clang-format check
        env:
          # Pinned to match the version developers run locally (`uv tool install
          # clang-format==23.1.3`). An unpinned apt clang-format reformats the tree on a
          # formatter upgrade and turns this gate into noise.
          CLANG_FORMAT_VERSION: "23.1.3"
        run: |
          set -euo pipefail
          FILES=$(find src tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \))
          if [ -z "$FILES" ]; then
            echo "::notice::no C++ sources to check yet - skipping clang-format check"
            exit 0
          fi
          pipx run --spec "clang-format==${CLANG_FORMAT_VERSION}" clang-format \
            --dry-run --Werror $FILES
name: Release

# Products are built on tags only (decided 2026-10-22): every push to main still runs ci.yml
# (three-platform build + tests + coverage), and a `v*` tag additionally produces the Windows
# installer and publishes it as a GitHub Release.
on:
  push:
    tags: ['v*']
  # Manual re-run while iterating on the packaging steps. The publish job below still requires a
  # tag ref, so a manual run never creates a release on its own.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Same vcpkg layout as ci.yml: outside the tracked tree, `.cache/` is git-ignored.
  VCPKG_ROOT_DIR: ${{ github.workspace }}/.cache/vcpkg
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.cache/vcpkg/vcpkg_installed
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/binary
  VCPKG_TARGET_TRIPLET: x64-windows

jobs:
  package-windows:
    name: package (windows-2022)
    runs-on: windows-2022
    # Packaging is a Release build plus windeployqt plus one MSI; the 45 min budget of the
    # test job covers it with room to spare. If this fires, the dependency step is the suspect.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # CMakeLists.txt owns the version; the tag only names it. A tag that disagrees means
          # the tree was bumped without a matching tag, so fail loudly instead of shipping a
          # 0.1.0 installer from a tag called v0.2.0.
          PROJECT_VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9.]\{1,\}\)[[:space:]]*$/\1/p' CMakeLists.txt | head -1)
          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::could not read VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "project version: $PROJECT_VERSION"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt VERSION $PROJECT_VERSION"
              exit 1
            fi
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure vcpkg environment
        shell: bash
        run: |
          # vcpkg refuses to start when VCPKG_DEFAULT_BINARY_CACHE names a directory that does
          # not exist, and a cold runner has none of these.
          mkdir -p "$VCPKG_BINARY_CACHE" "$VCPKG_INSTALLED_DIR" "$VCPKG_ROOT_DIR"
          echo "VCPKG_ROOT=$VCPKG_ROOT_DIR" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$VCPKG_BINARY_CACHE" >> "$GITHUB_ENV"
          echo "VCPKG_TARGET_TRIPLET=$VCPKG_TARGET_TRIPLET" >> "$GITHUB_ENV"
          # The runner images already ship python3, cmake and ninja; without this vcpkg builds
          # its own host copies (a full CPython source build, which then fails in autoreconf).
          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      - name: Cache vcpkg installed tree and downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLED_DIR }}
            ${{ env.VCPKG_ROOT_DIR }}/downloads
            ${{ env.VCPKG_ROOT_DIR }}/packages
            ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - uses: lukka/get-cmake@latest
        with:
          # Same pin as ci.yml, and for the same reason: CMake 4 does not cooperate with the
          # pinned vcpkg toolchain's prefix-path handling.
          cmakeVersion: '~3.31.0'
          ninjaVersion: '1.12.1'

      - name: Acquire vcpkg at the manifest baseline
        shell: bash
        run: |
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git init -q "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT_DIR" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT_DIR" checkout -q --force FETCH_HEAD
          (cd "$VCPKG_ROOT_DIR" && ./bootstrap-vcpkg.sh -disableMetrics)
          "$VCPKG_ROOT_DIR/vcpkg" version

      - name: Install Qt 6.8 + qtserialport
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtserialport
          cache: true

      - name: Install runtime dependencies (vcpkg, manifest mode)
        shell: bash
        run: |
          # Same derived manifest as ci.yml, minus gtest: this job configures with
          # OPENCRT_BUILD_TESTS=OFF, so a test dependency in the job that ships the installer is
          # minutes spent for nothing.
          export VCPKG_MANIFEST_DIR="$RUNNER_TEMP/vcpkg-release-manifest"
          python .github/scripts/ci-vcpkg-manifest.py "$VCPKG_MANIFEST_DIR" --platform "${{ runner.os }}"
          echo "VCPKG_MANIFEST_DIR=$VCPKG_MANIFEST_DIR" >> "$GITHUB_ENV"

          # Classic mode is selected by the working directory: vcpkg treats "there is a
          # vcpkg.json in CWD (or above)" as manifest mode and then rejects explicit package
          # arguments. Run from a scratch dir with VCPKG_MANIFEST_DIR cleared.
          CLASSIC_DIR="$RUNNER_TEMP/vcpkg-classic-mode"
          mkdir -p "$CLASSIC_DIR"
          unset VCPKG_MANIFEST_DIR
          set -f
          SPECS=""
          while IFS= read -r port || [ -n "$port" ]; do
            port="${port%$'\r'}"
            [ -z "$port" ] && continue
            SPECS="${SPECS} ${port}:${VCPKG_TARGET_TRIPLET}"
          done < "$RUNNER_TEMP/vcpkg-release-manifest/ports.txt"
          set +f
          if [ -z "${SPECS// /}" ]; then
            echo "::error::no ports left to install after applying the skip table"
            exit 1
          fi
          ( cd "$CLASSIC_DIR" && "$VCPKG_ROOT_DIR/vcpkg" install ${SPECS} \
              --x-install-root="$VCPKG_INSTALLED_DIR" )

      - name: Configure (windows-ci, Release, no tests)
        shell: bash
        run: |
          set -euo pipefail
          # install-qt-action exports QT_ROOT_DIR; it does NOT export Qt6_DIR. ci.yml has always
          # passed "$Qt6_DIR/.." to CMAKE_PREFIX_PATH, which expanded to an empty entry -- Qt was
          # still found, but by a mechanism nobody had written down. The prefix is explicit here
          # so packaging cannot inherit that ambiguity.
          if [ -z "${QT_ROOT_DIR:-}" ]; then
            echo "::error::QT_ROOT_DIR is empty -- install-qt-action did not run or changed layout"
            exit 1
          fi
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          cmake --preset windows-ci \
            -DOPENCRT_BUILD_TESTS=OFF \
            -DOPENCRT_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_MANIFEST_DIR="$VCPKG_MANIFEST_DIR" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET"

      - name: Build (windows-ci)
        shell: bash
        run: cmake --build --preset windows-ci

      - name: Smoke test the Release binary
        shell: bash
        run: out/build/windows-ci/bin/Release/openscrt.exe --version

      # The window shell is a GUI application now: the no-argument launch opens a window and
      # stays open, so it can no longer be smoke-tested by waiting for the process to exit.
      # --self-test builds the same window on the offscreen platform and exits, which proves
      # the shell assembles without needing a desktop session.
      - name: Smoke test the GUI shell
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'out/build/windows-ci/bin/Release/openscrt.exe'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process $exe -ArgumentList '--self-test' -NoNewWindow -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            throw "openscrt.exe --self-test exited with $($p.ExitCode)"
          }
          "GUI self-test exited with $($p.ExitCode)"

      - name: Stage the portable tree
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          STAGE_NAME="openscrt-$VERSION-windows-x64"
          # Two path forms on purpose: cmake is not an MSYS program and cannot read /d/a/...,
          # while find/sed/exec go through the MSYS runtime, which cannot read D:\a\...
          STAGE_WIN="$GITHUB_WORKSPACE/out/pkg/$STAGE_NAME"
          STAGE_POSIX="$(cygpath -u "$STAGE_WIN")"
          echo "STAGE_NAME=$STAGE_NAME" >> "$GITHUB_ENV"
          rm -rf "$STAGE_POSIX"
          # `cmake --install` is the single place that decides what an install tree contains, so
          # the ZIP and the MSI get byte-identical payloads.
          cmake --install out/build/windows-ci --config Release --prefix "$STAGE_WIN"

          # windeployqt copies the Qt runtime the exe imports plus the plugin categories Qt6
          # expects next to it -- that is what makes the tree run on a machine with no Qt.
          # --no-opengl-sw / --no-system-d3d-compiler drop ~80 MB of software-rasteriser DLLs.
          WINDEPLOYQT=""
          if command -v windeployqt.exe >/dev/null 2>&1; then
            WINDEPLOYQT="$(command -v windeployqt.exe)"
          else
            # QT_ROOT_DIR is <qt> itself, so windeployqt is one level down in bin. normpath in
            # Python because the separators in that variable belong to the Qt action, not to us.
            WINDEPLOYQT=$(python -c "import os; p = os.path.normpath(os.path.join(os.environ.get('QT_ROOT_DIR', ''), 'bin', 'windeployqt.exe')); print(p if os.path.isfile(p) else '')" || true)
          fi
          echo "QT_ROOT_DIR=${QT_ROOT_DIR:-<unset>}"

          EXE="$STAGE_WIN/bin/openscrt.exe"
          # MSYS rewrites any argument that looks like a POSIX path, so a bare `/dependents`
          # arrives at dumpbin as "C:/Program Files/Git/dependents" and the command dies with a
          # confusing exit code. MSYS2_ARG_CONV_EXCL switches that off for this one call.
          DEPS=$(MSYS2_ARG_CONV_EXCL='*' dumpbin /dependents "$EXE" \
                 | sed -n 's/^[[:space:]]*\([A-Za-z0-9_.-]*\.dll\)[[:space:]]*$/\1/p')
          if [ -z "$DEPS" ]; then
            echo "::error::could not read the dependency table out of dumpbin"
            MSYS2_ARG_CONV_EXCL='*' dumpbin /dependents "$EXE"
            exit 1
          fi
          echo "imports:"; for dll in $DEPS; do echo "  $dll"; done

          # windeployqt refuses anything it does not recognise as a Qt binary and exits 1.
          # The Phase 1 shell is a Qt Widgets application, so the import table now records the
          # Qt runtime and this branch is the expected path. It stays conditional on the
          # import table rather than on windeployqt's opinion, so a future change that drops
          # the Qt dependency does not break the packaging step.
          if echo "$DEPS" | grep -qiE '[A-Za-z0-9_-]*Qt6[A-Za-z0-9_-]*\.dll'; then
            if [ -z "$WINDEPLOYQT" ]; then
              echo "::error::the binary imports Qt but windeployqt.exe was not found"
              exit 1
            fi
            echo "windeployqt: $WINDEPLOYQT"
            "$WINDEPLOYQT" --release --no-translations --no-opengl-sw --no-system-d3d-compiler "$EXE"
          else
            echo "::notice::the binary imports no Qt library; skipping windeployqt"
          fi

          # Bundle every remaining imported DLL that Windows does not ship: vcpkg's libsodium.dll
          # (and openssl/libssh once those phases link them), the MSVC runtime, and the Universal
          # CRT forwarders, which live in System32\downlevel rather than System32. Resolving from
          # the toolchains that produced the imports means a new dependency is picked up by being
          # linked, not by someone remembering to add it here.
          shopt -s nullglob
          SEARCH_DIRS=(
            "$(cygpath -u "$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET/bin")"
            "$(cygpath -u "$QT_ROOT_DIR")/bin"
            "$(cygpath -u "$VCToolsRedistDir")"/x64/Microsoft.VC*.CRT
            "$(cygpath -u "$WindowsSdkDir")"Redist/ucrt/DLLs/x64
          )
          shopt -u nullglob
          for dll in $DEPS; do
            if [ -f "$STAGE_POSIX/bin/$dll" ] || [ -f "$SYSTEMROOT/System32/$dll" ]; then
              continue
            fi
            found=""
            for dir in "${SEARCH_DIRS[@]}"; do
              [ -d "$dir" ] || continue
              if [ -f "$dir/$dll" ]; then
                found="$dir/$dll"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "::warning::$dll is imported but was not found in any toolchain directory"
              continue
            fi
            cp -f "$found" "$STAGE_POSIX/bin/"
            echo "bundled $dll from ${found/$STAGE_POSIX\//}"
          done

          # The license of the project and the texts of the components that travel with it
          # have to be in the bundle: the LGPL of Qt asks for them, and a bundle without
          # them is not a lawful distribution.
          cp -f "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" "$STAGE_POSIX/"
          for copyright in "$(cygpath -u "$VCPKG_INSTALLED_DIR")"/share/*/copyright; do
            [ -f "$copyright" ] || continue
            port=$(basename "$(dirname "$copyright")")
            cp -f "$copyright" "$STAGE_POSIX/$port.copyright.txt"
          done
          if [ -d "$(cygpath -u "$QT_ROOT_DIR")/Licenses" ]; then
            cp -r "$(cygpath -u "$QT_ROOT_DIR")/Licenses" "$STAGE_POSIX/Qt-Licenses"
          else
            echo "::warning::the Qt installation has no Licenses directory; its text is not shipped"
          fi

          echo "staged files:"
          find "$STAGE_POSIX" -type f | sed "s|$STAGE_POSIX/||"

      - name: Verify the staged tree is self-contained
        shell: bash
        run: |
          set -euo pipefail
          STAGE_WIN="$GITHUB_WORKSPACE/out/pkg/$STAGE_NAME"
          STAGE_POSIX="$(cygpath -u "$STAGE_WIN")"
          # 1. It runs. Windows resolves an exe's own directory before anything else, so this is
          #    already evidence that the payload next to it is sufficient.
          "$STAGE_POSIX/bin/openscrt.exe" --version

          # 2. Every DLL the exe imports is either bundled or part of Windows. Checking the
          #    import table instead of asserting on one expected DLL name means this still bites
          #    on the day Qt code lands: if windeployqt stops deploying, vcruntime140 or
          #    Qt6Core.dll stops resolving and the run fails here.
          DEPS=$(MSYS2_ARG_CONV_EXCL='*' dumpbin /dependents "$STAGE_WIN/bin/openscrt.exe" \
                 | sed -n 's/^[[:space:]]*\([A-Za-z0-9_.-]*\.dll\)[[:space:]]*$/\1/p')
          if [ -z "$DEPS" ]; then
            echo "::error::could not read the dependency table out of dumpbin output"
            MSYS2_ARG_CONV_EXCL='*' dumpbin /dependents "$STAGE_WIN/bin/openscrt.exe"
            exit 1
          fi
          missing=""
          count=0
          for dll in $DEPS; do
            count=$((count + 1))
            if [ -f "$STAGE_POSIX/bin/$dll" ]; then
              echo "  bundled  $dll"
            elif [ -f "$SYSTEMROOT/System32/$dll" ]; then
              echo "  system   $dll"
            else
              missing="$missing $dll"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::imports neither bundled nor provided by Windows:$missing"
            exit 1
          fi
          echo "verified $count imports: bundled or from System32"

      - name: Build the portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'out/pkg'
          $zip = Join-Path $pkg "openSCRT-$version-windows-x64-portable.zip"
          # -Path on the folder (not its contents) so the archive unpacks into one named
          # directory instead of scattering openscrt.exe into the download folder.
          Compress-Archive -Path (Join-Path $pkg $env:STAGE_NAME) -DestinationPath $zip -Force
          "{0:N1} MB" -f ((Get-Item $zip).Length / 1MB)

      - name: Build the MSI (WiX)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'out/pkg'
          $stageName = "openscrt-$version-windows-x64"
          $stagePath = Join-Path $pkg $stageName
          $productWxs = Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/Product.wxs'

          Push-Location $pkg
          try {
            # The file list is harvested, not hand-written: windeployqt's output changes with
            # the Qt version, and a stale <File> list produces an MSI whose payload cannot start.
            # -srd drops the staging folder itself, so the tree lands directly in Program Files.
            # -var var.SourceDir makes the Source paths absolute at candle time; without it heat
            # emits the literal relative prefix "SourceDir\..." and light reports LGHT0103.
            & heat @('dir', $stageName, '-cg', 'HarvestedPayload', '-dr', 'INSTALLFOLDER',
                     '-srd', '-suid', '-ag', '-var', 'var.SourceDir', '-out', 'harvest.wxs')
            if ($LASTEXITCODE -ne 0) { throw "heat failed with $LASTEXITCODE" }

            # Every argument goes through an array with explicit quoting. PowerShell's handling of
            # a bareword like -dProductVersion=$version is not worth depending on: in a previous
            # run candle received the literal text "$version" and rejected the Product version.
            # WiX v3.14 ships preinstalled on the windows-2022 image (candle/light/heat).
            & candle @('-nologo', '-arch', 'x64', '-ext', 'WixUIExtension', '-ext', 'WixUtilExtension',
                       "-dProductVersion=$version", '-out', 'product.wixobj', $productWxs)
            if ($LASTEXITCODE -ne 0) { throw "candle failed with $LASTEXITCODE" }

            # light only accepts compiled .wixobj input; handing it harvest.wxs fails with
            # LGHT0048 ("must use 'wixOutput' as the document element name").
            & candle @('-nologo', '-arch', 'x64', "-dSourceDir=$stagePath", '-out', 'harvest.wixobj', 'harvest.wxs')
            if ($LASTEXITCODE -ne 0) { throw "candle (harvest) failed with $LASTEXITCODE" }

            & light @('-nologo', '-ext', 'WixUIExtension', '-ext', 'WixUtilExtension',
                      'product.wixobj', 'harvest.wixobj', '-out', "openSCRT-$version-windows-x64.msi")
            if ($LASTEXITCODE -ne 0) { throw "light failed with $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Verify the MSI payload (administrative install)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # /a is an administrative image: msiexec unpacks the MSI's files without installing
          # anything or needing admin, which proves the payload is complete. Running the exe out
          # of that extraction is the end-to-end check that the installer ships a working binary.
          $msi = (Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'out/pkg/*.msi')).FullName
          "verifying: $msi"
          $dest = Join-Path $env:RUNNER_TEMP 'msi-verify'
          $proc = Start-Process msiexec `
            -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dest`"") `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "msiexec /a failed with $($proc.ExitCode)" }

          # Every staged file must come out of the package. Compared by name rather than by
          # relative path: an administrative image recreates the directory tree under TARGETDIR
          # (Program Files\openSCRT\bin\...), and which of those intermediate folders appear is
          # the installer's business, not this check's.
          $stageRoot = Join-Path $env:GITHUB_WORKSPACE "out/pkg/$env:STAGE_NAME"
          $extracted = Get-ChildItem $dest -Recurse -File
          "extracted layout:"
          $extracted | ForEach-Object { "  $($_.FullName.Substring($dest.Length))" }

          $names = $extracted.Name
          $missing = @(
            foreach ($f in Get-ChildItem $stageRoot -Recurse -File) {
              if ($names -notcontains $f.Name) { $f.Name }
            }
          )
          if ($missing.Count -gt 0) { throw "MSI payload is missing: $($missing -join ', ')" }
          "payload complete: $($extracted.Count) files"

          $exe = ($extracted | Where-Object { $_.Name -eq 'openscrt.exe' } | Select-Object -First 1)
          if (-not $exe) { throw "openscrt.exe missing from the MSI payload" }
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "the installed binary exited with $LASTEXITCODE" }

      # The administrative image above proves the payload. This proves the installer: it installs
      # for real, lands where a user would look, registers in Add/Remove Programs, runs from
      # Program Files, and removes itself again. The Windows runner is an administrator, so a
      # per-machine install needs no elevation trickery -- this is the only machine in the loop
      # that can answer "does it actually install?".
      - name: Verify a real install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The version the tag resolved to, so this check never has to be edited per release.
          $version = '${{ steps.version.outputs.version }}'
          $msi = (Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'out/pkg/*.msi')).FullName
          $installDir = Join-Path $env:ProgramFiles 'openSCRT'
          $log = Join-Path $env:RUNNER_TEMP 'msiexec-install.log'

          function Invoke-Msi([string[]]$Arguments) {
            $p = Start-Process msiexec -ArgumentList $Arguments -Wait -PassThru
            # 3010 is "reboot required", which /norestart should prevent but must not fail on.
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
              throw "msiexec $($Arguments -join ' ') failed with $($p.ExitCode); see $log"
            }
            "msiexec exit $($p.ExitCode)"
          }

          Invoke-Msi @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`"")

          $exe = Join-Path $installDir 'bin\openscrt.exe'
          if (-not (Test-Path $exe)) { throw "install did not place openscrt.exe at $exe" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "the installed binary exited with $LASTEXITCODE" }

          # An installer that leaves no Add/Remove Programs entry cannot be uninstalled from the UI.
          $uninstallKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $entry = Get-ChildItem $uninstallKey |
                   Where-Object { (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq 'openSCRT' } |
                   Select-Object -First 1
          if (-not $entry) { throw 'no Add/Remove Programs entry named openSCRT' }
          $props = Get-ItemProperty $entry.PSPath
          "ARP: version=$($props.DisplayVersion) location=$($props.InstallLocation)"
          if ($props.DisplayVersion -notlike "$version*") {
            throw "Add/Remove Programs reports version $($props.DisplayVersion), expected $version"
          }
          if ($props.InstallLocation -notlike "*openSCRT*") {
            throw "Add/Remove Programs install location is '$($props.InstallLocation)', expected a path ending in openSCRT"
          }

          Invoke-Msi @('/x', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$log`"")
          if (Test-Path $installDir) { throw "uninstall left $installDir behind" }
          "install and uninstall both verified"

      - name: Checksums
        shell: pwsh
        run: |
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'out/pkg'
          $files = Get-ChildItem -Path (Join-Path $pkg '*') -Include *.msi, *.zip -Recurse
          $lines = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $sums = Join-Path $pkg 'SHA256SUMS-windows.txt'
          # LF, not CRLF: Set-Content would emit CRLF and the trailing \r becomes part of the file
          # name, which makes `sha256sum -c` / `shasum -c` fail on macOS and Linux.
          [System.IO.File]::WriteAllText($sums, ($lines -join "`n") + "`n")
          Get-Content $sums

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openSCRT-windows-x64
          path: |
            out/pkg/*.msi
            out/pkg/*.zip
            out/pkg/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 30

  package-macos:
    name: package (macos-14)
    runs-on: macos-14
    timeout-minutes: 90
    env:
      # The workflow-level env names the Windows triplet; a job-level env wins, and the port
      # list is derived per job anyway. The macOS runners are Apple Silicon, and vcpkg has to
      # build the dependencies for the same architecture as the compiler: linking an x86_64
      # library into an arm64 binary fails at the last step of the build.
      VCPKG_TARGET_TRIPLET: arm64-osx
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9.]\{1,\}\)[[:space:]]*$/\1/p' CMakeLists.txt | head -1)
          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::could not read VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "project version: $PROJECT_VERSION"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt VERSION $PROJECT_VERSION"
              exit 1
            fi
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install autotools (autotools-based vcpkg ports)
        shell: bash
        run: brew install autoconf automake libtool

      - uses: lukka/get-cmake@latest
        with:
          # The same pins as ci.yml: the version is a deliberate choice, not a floor.
          cmakeVersion: '~3.31.0'
          ninjaVersion: '1.12.1'

      - name: Acquire vcpkg at the manifest baseline
        shell: bash
        run: |
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git init -q "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT_DIR" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT_DIR" checkout -q --force FETCH_HEAD
          (cd "$VCPKG_ROOT_DIR" && ./bootstrap-vcpkg.sh -disableMetrics)
          "$VCPKG_ROOT_DIR/vcpkg" version

      - name: Install Qt 6.8 + qtserialport
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtserialport
          cache: true

      - name: Install runtime dependencies (vcpkg, manifest mode)
        shell: bash
        run: |
          export VCPKG_MANIFEST_DIR="$RUNNER_TEMP/vcpkg-release-manifest"
          python .github/scripts/ci-vcpkg-manifest.py "$VCPKG_MANIFEST_DIR" --platform "${{ runner.os }}"
          echo "VCPKG_MANIFEST_DIR=$VCPKG_MANIFEST_DIR" >> "$GITHUB_ENV"

          CLASSIC_DIR="$RUNNER_TEMP/vcpkg-classic-mode"
          mkdir -p "$CLASSIC_DIR"
          unset VCPKG_MANIFEST_DIR
          set -f
          SPECS=""
          while IFS= read -r port || [ -n "$port" ]; do
            port="${port%$'\r'}"
            [ -z "$port" ] && continue
            SPECS="${SPECS} ${port}:${VCPKG_TARGET_TRIPLET}"
          done < "$RUNNER_TEMP/vcpkg-release-manifest/ports.txt"
          set +f
          if [ -z "${SPECS// /}" ]; then
            echo "::error::no ports left to install after applying the skip table"
            exit 1
          fi
          ( cd "$CLASSIC_DIR" && "$VCPKG_ROOT_DIR/vcpkg" install ${SPECS} \
              --x-install-root="$VCPKG_INSTALLED_DIR" )

      - name: Configure (macos-ci, Release, no tests)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QT_ROOT_DIR:-}" ]; then
            echo "::error::QT_ROOT_DIR is empty -- install-qt-action did not run or changed layout"
            exit 1
          fi
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          cmake --preset macos-ci \
            -DOPENCRT_BUILD_TESTS=OFF \
            -DOPENCRT_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_MANIFEST_DIR="$VCPKG_MANIFEST_DIR" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET"

      - name: Build (macos-ci)
        shell: bash
        run: cmake --build --preset macos-ci

      - name: Smoke test the Release binary
        shell: bash
        run: out/build/macos-ci/bin/openscrt --version

      - name: Smoke test the GUI shell
        shell: bash
        run: QT_QPA_PLATFORM=offscreen out/build/macos-ci/bin/openscrt --self-test

      - name: Stage the app bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          STAGE_NAME="openscrt-$VERSION-macos-arm64"
          STAGE="$GITHUB_WORKSPACE/out/pkg/$STAGE_NAME"
          APP="$STAGE/openscrt.app"
          rm -rf "$STAGE"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Frameworks" "$APP/Contents/PlugIns/platforms"
          cmake --install out/build/macos-ci --config Release --prefix "$STAGE"
          mv "$STAGE/bin/openscrt" "$APP/Contents/MacOS/openscrt"
          rmdir "$STAGE/bin"

          # Every framework the Qt installation ships travels with the app. Working the
          # set out from the link lines looks tidier, but it is a guess: the first version
          # of this step walked the dependency graph and missed QtDBus, which QtGui links
          # against, and the bundle died with "Library not loaded: @rpath/QtDBus.framework".
          # Carrying the whole set costs disk space and nothing else.
          cp -R "$QT_ROOT_DIR"/lib/*.framework "$APP/Contents/Frameworks/"
          echo "bundled frameworks:"
          ls "$APP/Contents/Frameworks"

          # The build machine's Qt directory is baked into the load path; the bundle has to
          # work on a machine that has no Qt at all, so the path inside the bundle is added
          # and the build machine's path is dropped.
          install_name_tool -delete_rpath "$QT_ROOT_DIR/lib" \
            "$APP/Contents/MacOS/openscrt" 2>/dev/null || true
          install_name_tool -add_rpath "@executable_path/../Frameworks" \
            "$APP/Contents/MacOS/openscrt"

          # The platform plugin is loaded at run time, so it is in no link line and has to
          # be copied by hand. Qt looks for it in Contents/PlugIns.
          cp "$QT_ROOT_DIR"/plugins/platforms/*.dylib "$APP/Contents/PlugIns/platforms/"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>openSCRT</string>
            <key>CFBundleDisplayName</key><string>openSCRT</string>
            <key>CFBundleExecutable</key><string>openscrt</string>
            <key>CFBundleIdentifier</key><string>org.openscrt.terminal</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>VERSION_PLACEHOLDER</string>
            <key>CFBundleVersion</key><string>VERSION_PLACEHOLDER</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/VERSION_PLACEHOLDER/$VERSION/g" "$APP/Contents/Info.plist"

          # The bundle has to run on a machine with no Qt installed: the staged copy is
          # started here, with the plugins it ships, before it is packaged.
          QT_QPA_PLATFORM=offscreen "$APP/Contents/MacOS/openscrt" --self-test

          # The license of the project and the texts of the components that travel with it
          # have to be in the bundle: the LGPL of Qt asks for them.
          mkdir -p "$APP/Contents/Resources/Licenses"
          cp -f "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" \
            "$APP/Contents/Resources/Licenses/"
          for copyright in "$VCPKG_INSTALLED_DIR"/share/*/copyright; do
            [ -f "$copyright" ] || continue
            port=$(basename "$(dirname "$copyright")")
            cp -f "$copyright" "$APP/Contents/Resources/Licenses/$port.copyright.txt"
          done
          if [ -d "$QT_ROOT_DIR/Licenses" ]; then
            cp -R "$QT_ROOT_DIR/Licenses" "$APP/Contents/Resources/Licenses/Qt-Licenses"
          else
            echo "::warning::the Qt installation has no Licenses directory; its text is not shipped"
          fi

          tar -C "$STAGE" -czf "$GITHUB_WORKSPACE/out/pkg/openSCRT-$VERSION-macos-arm64.tar.gz" openscrt.app
          cd "$GITHUB_WORKSPACE/out/pkg"
          shasum -a 256 "openSCRT-$VERSION-macos-arm64.tar.gz" > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: openSCRT-macos-x64
          path: |
            out/pkg/openSCRT-*.tar.gz
            out/pkg/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 30

  package-linux:
    name: package (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\{1,\}\([0-9.]\{1,\}\)[[:space:]]*$/\1/p' CMakeLists.txt | head -1)
          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::could not read VERSION from CMakeLists.txt"
            exit 1
          fi
          echo "project version: $PROJECT_VERSION"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt VERSION $PROJECT_VERSION"
              exit 1
            fi
          fi
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install autotools (autotools-based vcpkg ports)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake libtool

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~3.31.0'
          ninjaVersion: '1.12.1'

      - name: Acquire vcpkg at the manifest baseline
        shell: bash
        run: |
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git init -q "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT_DIR" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT_DIR" checkout -q --force FETCH_HEAD
          (cd "$VCPKG_ROOT_DIR" && ./bootstrap-vcpkg.sh -disableMetrics)
          "$VCPKG_ROOT_DIR/vcpkg" version

      - name: Install Qt 6.8 + qtserialport
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtserialport
          cache: true

      - name: Install runtime dependencies (vcpkg, manifest mode)
        shell: bash
        run: |
          export VCPKG_MANIFEST_DIR="$RUNNER_TEMP/vcpkg-release-manifest"
          python .github/scripts/ci-vcpkg-manifest.py "$VCPKG_MANIFEST_DIR" --platform "${{ runner.os }}"
          echo "VCPKG_MANIFEST_DIR=$VCPKG_MANIFEST_DIR" >> "$GITHUB_ENV"

          CLASSIC_DIR="$RUNNER_TEMP/vcpkg-classic-mode"
          mkdir -p "$CLASSIC_DIR"
          unset VCPKG_MANIFEST_DIR
          set -f
          SPECS=""
          while IFS= read -r port || [ -n "$port" ]; do
            port="${port%$'\r'}"
            [ -z "$port" ] && continue
            SPECS="${SPECS} ${port}:${VCPKG_TARGET_TRIPLET}"
          done < "$RUNNER_TEMP/vcpkg-release-manifest/ports.txt"
          set +f
          if [ -z "${SPECS// /}" ]; then
            echo "::error::no ports left to install after applying the skip table"
            exit 1
          fi
          ( cd "$CLASSIC_DIR" && "$VCPKG_ROOT_DIR/vcpkg" install ${SPECS} \
              --x-install-root="$VCPKG_INSTALLED_DIR" )

      - name: Configure (linux-ci, Release, no tests)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${QT_ROOT_DIR:-}" ]; then
            echo "::error::QT_ROOT_DIR is empty -- install-qt-action did not run or changed layout"
            exit 1
          fi
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          cmake --preset linux-ci \
            -DOPENCRT_BUILD_TESTS=OFF \
            -DOPENCRT_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_MANIFEST_DIR="$VCPKG_MANIFEST_DIR" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET"

      - name: Build (linux-ci)
        shell: bash
        run: cmake --build --preset linux-ci

      - name: Smoke test the Release binary
        shell: bash
        run: out/build/linux-ci/bin/openscrt --version

      - name: Smoke test the GUI shell
        shell: bash
        run: QT_QPA_PLATFORM=offscreen out/build/linux-ci/bin/openscrt --self-test

      - name: Stage the portable tree
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          STAGE_NAME="openscrt-$VERSION-linux-x86_64"
          STAGE="$GITHUB_WORKSPACE/out/pkg/$STAGE_NAME"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/lib"
          cmake --install out/build/linux-ci --config Release --prefix "$STAGE"

          # Only the Qt runtime and the vcpkg libraries travel with the binary. The rest of
          # the dependency list is the desktop's own (libGL, libxcb, libstdc++), and shipping
          # a runner's copy of those onto a stranger's machine is how a package breaks a
          # working system.
          ldd "$STAGE/bin/openscrt" | sed -n 's/.*=> \(\/[^ ]*\).*/\1/p' | sort -u > "$STAGE/ldd.txt"
          while IFS= read -r lib || [ -n "$lib" ]; do
            case "$lib" in
              "$QT_ROOT_DIR"/*|"$VCPKG_INSTALLED_DIR"/*) cp -L "$lib" "$STAGE/lib/" ;;
            esac
          done < "$STAGE/ldd.txt"
          rm -f "$STAGE/ldd.txt"

          # Plugins are loaded at run time, not linked, so ldd never sees them.
          mkdir -p "$STAGE/lib/qt/plugins"
          cp -R "$QT_ROOT_DIR/plugins/platforms" "$STAGE/lib/qt/plugins/"
          cp -R "$QT_ROOT_DIR/plugins/imageformats" "$STAGE/lib/qt/plugins/"

          # The license of the project and the texts of the components that travel with it
          # have to be in the bundle: the LGPL of Qt asks for them.
          mkdir -p "$STAGE/Licenses"
          cp -f "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" "$STAGE/Licenses/"
          for copyright in "$VCPKG_INSTALLED_DIR"/share/*/copyright; do
            [ -f "$copyright" ] || continue
            port=$(basename "$(dirname "$copyright")")
            cp -f "$copyright" "$STAGE/Licenses/$port.copyright.txt"
          done
          if [ -d "$QT_ROOT_DIR/Licenses" ]; then
            cp -R "$QT_ROOT_DIR/Licenses" "$STAGE/Licenses/Qt-Licenses"
          else
            echo "::warning::the Qt installation has no Licenses directory; its text is not shipped"
          fi

          # The real binary gets a wrapper that points the loader and the plugin path at the
          # tree it was unpacked into, so the archive works wherever it is unpacked.
          mv "$STAGE/bin/openscrt" "$STAGE/bin/openscrt.bin"
          cat > "$STAGE/bin/openscrt" <<'WRAPPER'
          #!/bin/sh
          here=$(cd "$(dirname "$0")" && pwd)
          LD_LIBRARY_PATH="$here/../lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          QT_PLUGIN_PATH="$here/../lib/qt/plugins${QT_PLUGIN_PATH:+:$QT_PLUGIN_PATH}"
          export LD_LIBRARY_PATH QT_PLUGIN_PATH
          exec "$here/openscrt.bin" "$@"
          WRAPPER
          chmod +x "$STAGE/bin/openscrt"

      - name: Verify the staged tree is self-contained
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$GITHUB_WORKSPACE/out/pkg/openscrt-${{ steps.version.outputs.version }}-linux-x86_64"
          "$STAGE/bin/openscrt" --version
          QT_QPA_PLATFORM=offscreen "$STAGE/bin/openscrt" --self-test

      - name: Pack the tree
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          cd "$GITHUB_WORKSPACE/out/pkg"
          tar -czf "openSCRT-$VERSION-linux-x86_64.tar.gz" "openscrt-$VERSION-linux-x86_64"
          sha256sum "openSCRT-$VERSION-linux-x86_64.tar.gz" > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: openSCRT-linux-x86_64
          path: |
            out/pkg/openSCRT-*.tar.gz
            out/pkg/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish release
    # Every platform, and `always()` on top of it: the release has to wait for the macOS and
    # Linux packages, but a platform that failed to package must not take the release down
    # with it -- the artifacts that did get built are still published.
    needs: [package-windows, package-macos, package-linux]
    # Manual runs (workflow_dispatch) build and upload artifacts but must not publish: only a tag
    # push is allowed to create a public Release.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # Every platform's artifact, merged into one directory. A pattern instead of a
          # single name so a platform that failed to package does not take the release down
          # with it: the Windows assets are always there, and the file names say which
          # platform each one is for.
          pattern: openSCRT-*
          path: dist
          merge-multiple: true

      - name: Merge the per-platform checksum files
        shell: bash
        run: |
          set -euo pipefail
          # Each platform job writes its own list; the release page points at one file, so
          # they are concatenated here. Merging them this way keeps every platform's hash
          # instead of letting the last upload overwrite the others.
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm -f dist/SHA256SUMS-*.txt
          cat dist/SHA256SUMS.txt

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Builds of openSCRT for Windows, macOS and Linux.

            **0.1.2 is the first release with a window.** 0.1.0 and 0.1.1 were the
            command-line bootstrap: double-clicking the binary printed a message and exited.
            This one opens the terminal window with the Session Manager dock, the tabbed
            workspace and the Quick Connect dialog; `openscrt.exe --version` still prints
            the build details for a bug report.

            Requires Windows 10 1809 or later: the Qt runtime in the package imports
            kernel32 exports that older systems do not export, and the loader stops the
            program before it can say so itself.

            | Artifact | Platform | Install |
            | --- | --- | --- |
            | `openSCRT-<version>-windows-x64.msi` | Windows x64 | Double-click. Installs per-machine to `%ProgramFiles%\openSCRT` with an uninstall entry in Add/Remove Programs. The installer does not touch `PATH`; add `%ProgramFiles%\openSCRT\bin` yourself if you want the command on `PATH`. |
            | `openSCRT-<version>-windows-x64-portable.zip` | Windows x64 | Unzip anywhere and run `bin\openscrt.exe`. No installation, no admin rights. |
            | `openSCRT-<version>-macos-arm64.tar.gz` | macOS Apple Silicon | Unpack, then open `openscrt.app`. |
            | `openSCRT-<version>-linux-x86_64.tar.gz` | Linux x86_64 | Unpack, then run `bin/openscrt`; the wrapper points the loader and the Qt plugin path at the unpacked tree. |

            Every archive carries the runtime the binary needs -- the Qt libraries and, on
            Windows, `libsodium` and the UCRT forwarders -- so none of them needs Qt or
            libsodium installed.

            Verify a download against `SHA256SUMS.txt`.
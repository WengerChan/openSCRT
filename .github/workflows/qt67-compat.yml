name: Qt 6.7 compatibility

# Does the project still build and pass its tests against a Qt whose package floor is
# Windows 10 1607? Qt 6.5, 6.6 and 6.7 have that floor; 6.8 does not (see
# docs/decisions/0001-windows-floor-and-qt-matrix.md and the qt-floor-report workflow).
#
# This is the premise of option C there: a package for 1607 needs a Qt that runs on
# 1607, and the code has to work with it. The measurement said the Qt exists; this
# says whether the code does.
#
# It runs on demand and weekly, and it never gates a push: whether a 1607 package
# should be shipped is still a product decision, and a red job here would only mean
# "the option is closed for now", not "the project is broken".

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:47 UTC -- after the floor report, which runs at 03:17.
    - cron: "47 3 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: build and test against Qt 6.7
    runs-on: windows-2022
    timeout-minutes: 60
    # A failure here means the 1607 option closed, not that the project broke.
    continue-on-error: true
    env:
      VCPKG_TARGET_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Configure vcpkg environment
        shell: bash
        run: |
          mkdir -p "$VCPKG_BINARY_CACHE" "$VCPKG_INSTALLED_DIR" "$VCPKG_ROOT_DIR"
          echo "VCPKG_ROOT=$VCPKG_ROOT_DIR" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$VCPKG_BINARY_CACHE" >> "$GITHUB_ENV"
          echo "VCPKG_TARGET_TRIPLET=${{ env.VCPKG_TARGET_TRIPLET }}" >> "$GITHUB_ENV"
          echo "VCPKG_FORCE_SYSTEM_BINARIES=1" >> "$GITHUB_ENV"

      - name: Cache vcpkg installed tree and downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLED_DIR }}
            ${{ env.VCPKG_ROOT_DIR }}/downloads
            ${{ env.VCPKG_ROOT_DIR }}/packages
            ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - uses: lukka/get-cmake@latest
        with:
          # The same pin as the main CI: the pinned vcpkg toolchain does not cooperate
          # with CMake 4's prefix-path handling.
          cmakeVersion: '~3.31.0'
          ninjaVersion: '1.12.1'

      - name: Acquire vcpkg at the manifest baseline
        shell: bash
        run: |
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git init -q "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT_DIR" fetch -q --depth 1 origin "$BASELINE"
          git -C "$VCPKG_ROOT_DIR" checkout -q --force FETCH_HEAD
          (cd "$VCPKG_ROOT_DIR" && ./bootstrap-vcpkg.sh -disableMetrics)
          "$VCPKG_ROOT_DIR/vcpkg" version

      - name: Install Qt 6.7 + qtserialport
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7'
          modules: qtserialport
          cache: true

      - name: Install the ports the tree links
        shell: bash
        run: |
          set -euo pipefail
          export VCPKG_MANIFEST_DIR="$RUNNER_TEMP/vcpkg-ci-manifest"
          python .github/scripts/ci-vcpkg-manifest.py "$VCPKG_MANIFEST_DIR" --with-tests --platform "${{ runner.os }}"
          echo "VCPKG_MANIFEST_DIR=$VCPKG_MANIFEST_DIR" >> "$GITHUB_ENV"

          # Classic mode, like the main CI: the working directory selects it.
          set -f
          SPECS=""
          while IFS= read -r port || [ -n "$port" ]; do
            port="${port%$'\r'}"
            [ -z "$port" ] && continue
            SPECS="${SPECS} ${port}:${VCPKG_TARGET_TRIPLET}"
          done < "$VCPKG_MANIFEST_DIR/ports.txt"
          set +f
          if [ -z "${SPECS// /}" ]; then
            echo "::error::no ports left to install after applying the SKIP table"
            exit 1
          fi
          CLASSIC_DIR="$RUNNER_TEMP/vcpkg-classic-mode"
          mkdir -p "$CLASSIC_DIR"
          (cd "$CLASSIC_DIR" && "$VCPKG_ROOT_DIR/vcpkg" install $SPECS --x-install-root="$VCPKG_INSTALLED_DIR")

      - name: Configure against Qt 6.7
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset windows-ci \
            -DOPENCRT_ENABLE_COVERAGE=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_MANIFEST_DIR="$VCPKG_MANIFEST_DIR" \
            -DVCPKG_MANIFEST_INSTALL=OFF \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET" \
            -DGTest_ROOT="$VCPKG_INSTALLED_DIR/$VCPKG_TARGET_TRIPLET"

      - name: Build
        shell: bash
        run: cmake --build --preset windows-ci

      - name: Test (unit tier)
        shell: bash
        run: ctest --test-dir out/build/windows-ci -C Release -L unit --output-on-failure --timeout 600

      - name: The floor of this Qt
        shell: bash
        run: |
          set -euo pipefail
          # The package floor of a 6.7 build. It is the number the 1607 option depends on,
          # measured from the kernel32 export table rather than from the documentation.
          python .github/scripts/check_import_floor.py \
            --report "$QT_ROOT_DIR/bin/Qt6Core.dll" \
            --report "$QT_ROOT_DIR/bin/Qt6Gui.dll" \
            --report "$QT_ROOT_DIR/bin/Qt6Widgets.dll" \
            --report "$QT_ROOT_DIR/bin/Qt6Network.dll" \
            | tee qt-floor-6.7.txt

      - name: Upload the measurement
        uses: actions/upload-artifact@v4
        with:
          name: qt-6.7-compat
          path: qt-floor-6.7.txt
          if-no-files-found: error

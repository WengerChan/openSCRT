name: Qt floor report

# The question this answers: is there a Qt whose package floor is still Windows 10 1607?
# See docs/decisions/0001-windows-floor-and-qt-matrix.md.
#
# The floor is measured from the kernel32 export table, not from the documentation, so the
# answer is a measurement and not an opinion: the same script that gates our own binaries
# reports the floor of a Qt that was never built here.
#
# This workflow runs on demand and weekly. It must never gate anything: the answer
# decides what to do next, and a job that goes red would block every push until the
# decision is made. Every job is continue-on-error for the same reason -- a Qt version
# that aqt stops offering is a gap in the answer, not a failure of the project.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:17 UTC. The Qt versions move slowly, and a weekly answer is
    # enough to notice when a new one raises the floor.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  measure:
    name: Qt ${{ matrix.qt }} floor
    runs-on: windows-2022
    timeout-minutes: 30
    # A Qt version that cannot be installed is a hole in the answer, not a red build.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # The newest of each 6.x series. 6.8 is what the project ships today; the older
        # ones are the candidates for a 1607 floor.
        qt: ['6.5', '6.6', '6.7', '6.8']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      - name: Measure the floor of this Qt
        shell: bash
        run: |
          set -euo pipefail
          # --report prints the floor of a binary and never fails the run: the gate is
          # only armed when --package-floor is given, and this measurement is not a gate.
          python .github/scripts/check_import_floor.py \
            --report "$QT_ROOT_DIR/bin/Qt6Core.dll" \
            --report "$QT_ROOT_DIR/bin/Qt6Gui.dll" \
            --report "$QT_ROOT_DIR/bin/Qt6Widgets.dll" \
            --report "$QT_ROOT_DIR/bin/Qt6Network.dll" \
            | tee "qt-floor-${{ matrix.qt }}.txt"

      - name: Upload the measurement
        uses: actions/upload-artifact@v4
        with:
          name: qt-floor-${{ matrix.qt }}
          path: qt-floor-*.txt
          if-no-files-found: error
